<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="拆解漢字、拖曳排列部件，再組合成新的字。所有轉換都在你的瀏覽器中完成。">
  <title>chicomp · 漢字部件拆合</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <header>
      <a class="wordmark" href="./">chicomp<span>漢字部件拆合</span></a>
      <p>拆開一個字，重新排列它的部件。</p>
      <div id="status" role="status" aria-live="polite">正在載入…</div>
    </header>
    <noscript>這個工具需要啟用 JavaScript。</noscript>
    <section aria-labelledby="input-title">
      <div class="section-heading"><h1 id="input-title"><span>01</span>輸入文字</h1><button id="example" class="quiet" type="button" disabled>試試範例</button></div>
      <form id="input-form">
        <label class="sr-only" for="input">要拆解的文字</label>
        <input id="input" type="text" maxlength="128" placeholder="例如：功夫不好不要艹我" autocomplete="off" disabled>
        <button id="decompose" type="submit" disabled>拆成部件</button>
      </form>
    </section>
    <section aria-labelledby="edit-title">
      <div class="section-heading"><h2 id="edit-title"><span>02</span>排列部件</h2><button id="clear" class="quiet" type="button" disabled>清空</button></div>
      <p class="hint" id="edit-help">拖曳調整順序 · 雙擊複製 · 選取後用方向鍵移動、Delete 刪除</p>
      <div id="editor" aria-label="部件排列" aria-describedby="edit-help"></div>
      <div class="editor-actions">
        <div id="trash" aria-label="拖曳部件到此刪除"><span>拖到這裡刪除</span></div>
        <button id="compose" type="button" disabled>組合成字</button>
      </div>
    </section>
    <section aria-labelledby="result-title">
      <div class="section-heading"><h2 id="result-title"><span>03</span>組合結果</h2><button id="copy" class="quiet" type="button" disabled>複製文字</button></div>
      <output id="result" aria-live="polite">等待組合</output>
      <div id="character-info" aria-label="字碼資訊"></div>
    </section>
    <p id="error" role="alert" hidden></p>
    <section class="library" aria-labelledby="library-title">
      <div class="section-heading"><h2 id="library-title">部件庫</h2><label class="filter-label">筆畫 <select id="stroke-filter" disabled><option value="">全部</option></select></label></div>
      <p class="hint">點選加入排列。「特」表示官方資料中的特殊部件。</p>
      <div id="components" aria-label="可選部件"></div>
    </section>
    <footer>
      <p>轉換在瀏覽器內完成，輸入文字不會上傳。</p>
      <p>資料來源：數位發展部 <a href="https://www.cns11643.gov.tw/" target="_blank" rel="noopener noreferrer">CNS11643 全字庫</a> · <span id="data-version"></span></p>
      <p><a href="https://github.com/buganini/chicomp">原始碼</a> · <a href="https://github.com/buganini/bsdconv">bsdconv</a> · <a href="./BSDCONV-LICENSE.txt">bsdconv 授權</a> · <a href="./COMPRESS-UTILS-LICENSE.txt">compress-utils 授權</a> · <a href="./SORTABLE-LICENSE.txt">SortableJS 授權</a></p>
    </footer>
  </main>
</body>
</html>
