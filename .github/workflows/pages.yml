name: Build and deploy chicomp
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install -r requirements.txt
          npm ci
      - name: Set up Emscripten
        shell: bash
        run: |
          sdk_commit=$(python -c 'import json; print(json.load(open("sources.lock.json"))["emsdk_commit"])')
          sdk_version=$(python -c 'import json; print(json.load(open("sources.lock.json"))["emscripten"])')
          git init .build/emsdk
          git -C .build/emsdk remote add origin https://github.com/emscripten-core/emsdk.git
          git -C .build/emsdk fetch --depth 1 origin "$sdk_commit"
          git -C .build/emsdk checkout --detach FETCH_HEAD
          .build/emsdk/emsdk install "$sdk_version"
          .build/emsdk/emsdk activate "$sdk_version"
      - name: Build and validate static site
        shell: bash
        run: |
          build_python=$(command -v python)
          source .build/emsdk/emsdk_env.sh
          make build PYTHON="$build_python"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
